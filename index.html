<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unknown Pleasures Album Cover</title>
    <style>
        html, body {
            height: 100%;
            height: 100%;
            margin: 0;
            display: flex;
        }

        .canvContainer {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }

        canvas {
            display: inline;
            border: 1px solid black;
            width: min(100vw, calc(100vh * 3 / 4));
            aspect-ratio: 3 / 4;
            height: auto;
            box-sizing: border-box;
        }

        .sliders {
            margin: 20px;
        }

        .rendererSelection > label {
            display: block;
            margin-block: 0.75rem;
        }

        .rendererSettings {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

    </style>
    <script type="module" src="./main.js"></script>
</head>
<body>
    <!-- Thanks to GPT-5.6 Sol (Medium) yk damn well im not writing all these myself.-->
    <div class="sliders">
        <div class="globalSettings">
            <label for="lineCount">Line count (4, 180): </label>
            <br/>
            <input type="range" id="lineCount" name="lineCount" min="4" max="180" value="80"><span class="sliderValue">80</span>
            <br/>
            <label for="animationFps">Animation FPS (1, 60): </label>
            <input type="range" id="animationFps" name="animationFps" min="1" max="60" value="7"><span class="sliderValue">7</span>
            <br/>
            <br/>
        </div>
        <div class="rendererSettings">
        </div>
    </div>
    <div class="canvContainer">
        <canvas id="album_canvas" width="1200" height="1600"></canvas>
    </div>
    <div class="rendererSelection" id="rendererSelection">
        <label>
            <input type="radio" name="renderMode" value="procedural" checked>
            CoderCowMoo implementation
        </label>
        <label>
            <input type="radio" name="renderMode" value="reference">
            Denis Vida (<a href="https://github.com/dvida/UnknownPleasuresGenerator">dvida</a>) implementation
        </label>
        <label>
            <input type="radio" name="renderMode" value="audio">
            Audio visualiser
        </label>
    </div>
</body>
</html>
