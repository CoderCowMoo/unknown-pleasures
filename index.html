<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unknown Pleasures Album Cover</title>
    <style>
        html, body {
            height: 100%;
            height: 100%;
            margin: 0;
            display: flex;
        }

        .canv_container {
            width: 100%;
            height: 100%;
            display: grid;
            place-items: center;
        }

        canvas {
            display: inline;
            border: 1px solid black;
            width: min(100vw, calc(100vh * 3 / 4));
            aspect-ratio: 3 / 4;
            height: auto;
            box-sizing: border-box;
        }

        .sliders {
            margin: 20px;
        }

    </style>
    <script type="module" src="draw.js"></script>
</head>
<body>
    <!-- Thanks to GPT-5.6 Sol (Medium) yk damn well im not writing all these myself.-->
    <div class="sliders">
        <label for="lineCount">Line count (4, 180): </label>
        <br/>
        <input type="range" id="lineCount" name="lineCount" min="4" max="180" value="80"><span class="sliderValue">80</span>
        <br/>
        <label for="animationFps">Animation FPS (1, 60): </label>
        <input type="range" id="animationFps" name="animationFps" min="1" max="60" value="7"><span class="sliderValue">7</span>
        <br/>
        <br/>

        <label for="peakOneCenter">Peak one center (120, 1080): </label>
        <input type="range" id="peakOneCenter" name="peakOneCenter" min="120" max="1080" value="480"><span class="sliderValue">480</span>
        <br/>
        <label for="peakOneCenterDeviation">Peak one center deviation (0, 200): </label>
        <input type="range" id="peakOneCenterDeviation" name="peakOneCenterDeviation" min="0" max="200" value="20"><span class="sliderValue">20</span>
        <br/>
        <label for="peakOneWidth">Peak one width (10, 200): </label>
        <input type="range" id="peakOneWidth" name="peakOneWidth" min="10" max="200" value="60"><span class="sliderValue">60</span>
        <br/>
        <label for="peakOneWidthDeviation">Peak one width deviation (0, 100): </label>
        <input type="range" id="peakOneWidthDeviation" name="peakOneWidthDeviation" min="0" max="100" value="10"><span class="sliderValue">10</span>
        <br/>
        <label for="peakOneHeight">Peak one height (0, 250): </label>
        <input type="range" id="peakOneHeight" name="peakOneHeight" min="0" max="250" value="80"><span class="sliderValue">80</span>
        <br/>
        <label for="peakOneHeightDeviation">Peak one height deviation (0, 100): </label>
        <input type="range" id="peakOneHeightDeviation" name="peakOneHeightDeviation" min="0" max="100" value="15"><span class="sliderValue">15</span>
        <br/>
        <br/>

        <label for="peakTwoCenter">Peak two center (120, 1080): </label>
        <input type="range" id="peakTwoCenter" name="peakTwoCenter" min="120" max="1080" value="720"><span class="sliderValue">720</span>
        <br/>
        <label for="peakTwoCenterDeviation">Peak two center deviation (0, 200): </label>
        <input type="range" id="peakTwoCenterDeviation" name="peakTwoCenterDeviation" min="0" max="200" value="20"><span class="sliderValue">20</span>
        <br/>
        <label for="peakTwoWidth">Peak two width (10, 200): </label>
        <input type="range" id="peakTwoWidth" name="peakTwoWidth" min="10" max="200" value="30"><span class="sliderValue">30</span>
        <br/>
        <label for="peakTwoWidthDeviation">Peak two width deviation (0, 100): </label>
        <input type="range" id="peakTwoWidthDeviation" name="peakTwoWidthDeviation" min="0" max="100" value="25"><span class="sliderValue">25</span>
        <br/>
        <label for="peakTwoHeight">Peak two height (0, 250): </label>
        <input type="range" id="peakTwoHeight" name="peakTwoHeight" min="0" max="250" value="40"><span class="sliderValue">40</span>
        <br/>
        <label for="peakTwoHeightDeviation">Peak two height deviation (0, 100): </label>
        <input type="range" id="peakTwoHeightDeviation" name="peakTwoHeightDeviation" min="0" max="100" value="15"><span class="sliderValue">15</span>
        <br/>
        <br/>
        <label for="noiseStrength">Perlin noise strength (0, 100): </label>
        <input type="range" id="noiseStrength" name="noiseStrength" min="0" max="100" value="4"><span class="sliderValue">4</span>
    </div>
    <div class="canv_container">
        <canvas id="album_canvas" width="1200" height="1600"></canvas>
    </div>
</body>
</html>
